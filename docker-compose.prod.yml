# Log rotation for every service. Docker rotates by size, not age: the Privacy Policy promises
# logs are deleted after VITE_LOG_RETENTION_DAYS days, so make sure your host (or log shipper)
# enforces that age limit too. See docs/OPERATIONS.md.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  postgres:
    image: postgres:17-alpine
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: [typeroom-postgres:/var/lib/postgresql/data]
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    logging: *logging
    environment:
      NODE_ENV: production
      PORT: 3000
      CLIENT_ORIGIN: ${CLIENT_ORIGIN}
      DATABASE_URL: ${DATABASE_URL}
      # nginx (the web service) is the only way in, and it overwrites X-Forwarded-For.
      TRUST_PROXY: "true"
      ROOM_IDLE_MS: ${ROOM_IDLE_MS:-600000}
    # Not published on the host: clients reach it only through nginx, so X-Forwarded-For can be trusted.
    expose: ["3000"]
    depends_on:
      postgres: { condition: service_started }
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      # Baked into the static bundle at build time; unset values show as [[PLACEHOLDERS]].
      args:
        VITE_CONTACT_EMAIL: ${VITE_CONTACT_EMAIL:-}
        VITE_OPERATOR_NAME: ${VITE_OPERATOR_NAME:-}
        VITE_JURISDICTION: ${VITE_JURISDICTION:-}
        VITE_LOG_RETENTION_DAYS: ${VITE_LOG_RETENTION_DAYS:-}
        VITE_HOSTING_PROVIDER: ${VITE_HOSTING_PROVIDER:-}
        VITE_REPO_URL: ${VITE_REPO_URL:-}
    logging: *logging
    ports: ["${WEB_PORT:-8080}:80"]
    depends_on:
      server: { condition: service_started }
volumes:
  typeroom-postgres:
