server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Access logs record the client IP, time, request line, status, referrer and user agent.
  # The Privacy Policy states this and the retention period (VITE_LOG_RETENTION_DAYS); keep them in sync.

  location /socket.io/ {
    proxy_pass http://server:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    # Overwrite (never append) so a client can't spoof its address; the server trusts this header
    # only when TRUST_PROXY=true. If another proxy/CDN sits in front of nginx, configure
    # set_real_ip_from/real_ip_header so $remote_addr is the real client.
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  # Client-side routes (/about, /r/CODE, ...) are served by the SPA, which renders its own 404 page.
  location / { try_files $uri $uri/ /index.html; }
}
