<!doctype html>
<html lang="en" data-theme="ember">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Race your friends in real time, one keystroke at a time." />
    <title>Typeroom</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3 27 9.5v13L16 29 5 22.5v-13L16 3Z' fill='none' stroke='%23ffffff' stroke-width='2' stroke-linejoin='round'/%3E%3Cpath d='M5 9.5 16 16l11-6.5M16 16v13' fill='none' stroke='%23ffffff' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <!-- Apply the saved theme before first paint so there is no flash of the default theme. -->
    <script>
      try {
        var saved = JSON.parse(localStorage.getItem('typeroom.settings') || '{}');
        if (typeof saved.theme === 'string' && /^[a-z-]{1,32}$/.test(saved.theme)) document.documentElement.dataset.theme = saved.theme;
        if (saved.motion === 'reduce' || saved.motion === 'full') document.documentElement.dataset.motion = saved.motion;
      } catch (error) {}
    </script>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
