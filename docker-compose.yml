services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: typeroom
      POSTGRES_PASSWORD: typeroom
      POSTGRES_DB: typeroom
    volumes: [typeroom-postgres:/var/lib/postgresql/data]
    # Published so the natively-run server (pnpm dev) can reach it at localhost:5433.
    # 5433, not 5432, because a Windows-installed PostgreSQL already owns 5432 on this machine.
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U typeroom -d typeroom"]
      interval: 5s
      timeout: 5s
      retries: 10
  # server and web only start with `docker compose --profile full up`.
  # Day to day, run the app natively with `pnpm dev`; Docker is just for the database.
  server:
    profiles: [full]
    image: node:22-alpine
    working_dir: /app
    command: sh -c "corepack enable && pnpm install && pnpm --filter @typeroom/server dev"
    volumes:
      - .:/app
      - typeroom-node-modules:/app/node_modules
    environment:
      NODE_ENV: development
      PORT: 3000
      CLIENT_ORIGIN: http://localhost:5173
      DATABASE_URL: postgres://typeroom:typeroom@postgres:5432/typeroom
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 120s
    ports: ["3000:3000"]
    depends_on:
      postgres: { condition: service_healthy }
  web:
    profiles: [full]
    image: node:22-alpine
    working_dir: /app
    command: sh -c "corepack enable && pnpm install && pnpm --filter @typeroom/web dev"
    volumes:
      - .:/app
      - typeroom-node-modules:/app/node_modules
    environment:
      VITE_SOCKET_URL: http://localhost:3000
    ports: ["5173:5173"]
    depends_on:
      server: { condition: service_healthy }
volumes:
  typeroom-postgres:
  typeroom-node-modules:
